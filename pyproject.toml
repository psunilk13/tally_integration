[build-system]
requires = ["setuptools>=40.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tally_integration"
version = "0.0.1"
description = "Tally Integration for ERPNext"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.6"
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/tally_integration"
Repository = "https://github.com/yourusername/tally_integration"

[tool.setuptools]
packages = ["tally_integration"]

[tool.setuptools.package-data]
tally_integration = ["*.json", "*.js", "*.css", "*.html", "*.md"]
